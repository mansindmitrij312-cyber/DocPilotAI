{% extends "base.html" %}

{% block title %}Новый пароль | DocPilot AI{% endblock %}

{% block body %}

<div class="page">

{% include "_nav.html" %}

<div class="auth-page animate">

<div class="auth-card">

<div class="eyebrow mb-16">Новый пароль</div>

<h1>Придумайте пароль</h1>
<p class="auth-sub">Ссылка действительна один час и работает один раз.</p>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<form method="POST">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="field">
<label>Новый пароль</label>
<input class="input" type="password" name="password" placeholder="Минимум 6 символов" required minlength="6" autofocus>
</div>

<div class="field">
<label>Повторите пароль</label>
<input class="input" type="password" name="password_confirm" placeholder="Ещё раз" required minlength="6">
</div>

<button class="btn btn-primary btn-block" type="submit">Сохранить пароль</button>

</form>

</div>

</div>

</div>

{% endblock %}
